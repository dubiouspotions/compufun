name: "godot-ci export"
on:
  push:
    branches:
      - "main"
  # A manual run is a release: it bumps the version, tags main and deploys to itch.io.
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to bump"
        type: choice
        options: [patch, minor, major]
        default: patch

env:
  GODOT_VERSION: 4.7.2
  EXPORT_NAME: CompuFun
  # Set up these as Github Secrets:
  ITCHIO_API_KEY: ${{ secrets.ITCHIO_API_KEY }}
  ITCHIO_USERNAME: ${{ secrets.ITCHIO_USERNAME }}
  ITCHIO_GAME: ${{ secrets.ITCHIO_GAME }}
  LOGFILE: build.log

defaults:
  run:
    shell: bash
    working-directory: Godot

jobs:
  version:
    # The vX.Y.Z tags are the only record of the version (docs/building-and-testing.md, "Releasing").
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      previous: ${{ steps.version.outputs.previous }}
      release: ${{ steps.version.outputs.release }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        env:
          BUMP: ${{ inputs.bump }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          tags() { git tag --list 'v*' | grep -E "$semver" | sort -V; }
          latest="$(tags | tail -1)" || true
          [ -n "$latest" ] || { echo "::error::no vX.Y.Z tag in the repo; tag the first release by hand"; exit 1; }
          if [ "$EVENT" != workflow_dispatch ]; then
            desc="$(git describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*')"
            echo "Build version ${desc#v}"
            { echo "version=${desc#v}"; echo "previous="; echo "release=false"; } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::releases are made from main, not $GITHUB_REF"; exit 1; }
          here="$(git tag --points-at HEAD | grep -E "$semver" | sort -V | tail -1)" || true
          if [ -n "$here" ]; then
            # A re-run, or a release of a commit that is already released: keep its version.
            tag="$here"
            previous="$(tags | grep -B1 -x "$here" | head -1)"
            [ "$previous" != "$here" ] || previous=""
            echo "::notice::$GITHUB_SHA is already $tag; releasing it again without a bump"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            case "$BUMP" in
              major) tag="v$((major + 1)).0.0" ;;
              minor) tag="v$major.$((minor + 1)).0" ;;
              patch) tag="v$major.$minor.$((patch + 1))" ;;
              *) echo "::error::bump must be major, minor or patch, not '$BUMP'"; exit 1 ;;
            esac
            previous="$latest"
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          echo "Release ${tag#v} (previous: ${previous:-none})"
          { echo "version=${tag#v}"; echo "previous=$previous"; echo "release=true"; } >> "$GITHUB_OUTPUT"

  voice:
    # The live voice (native/chimera_voice): macOS needs a Mac; Linux, Windows and the web build here.
    name: Live Voice ${{ matrix.targets }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - os: macos-latest
            targets: macos
          - os: ubuntu-latest
            targets: wasm linux windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/chimera_voice/target
          key: voice-${{ matrix.os }}-${{ hashFiles('native/chimera_voice/**', 'tools/build-voice.sh') }}
      - name: Windows linker
        if: runner.os == 'Linux'
        run: sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build
        run: bash tools/build-voice.sh ${{ matrix.targets }}
      - uses: actions/upload-artifact@v4
        with:
          name: voice-${{ matrix.os }}
          path: |
            Godot/voices/live/bin/
            Godot/voices/live/chimera_voice.wasm
          if-no-files-found: error

  voice-release:
    # The launchers download these zips (docs/building-and-testing.md, "Voices").
    name: Live Voice Release
    needs: [voice]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: live-voice-release
      cancel-in-progress: false
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: voice-*
          path: artifacts
      - name: Upload when the release is stale or this push changed the voice
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          paths=(native/chimera_voice tools/build-voice.sh)
          want="$(git rev-parse HEAD:native/chimera_voice)"
          git fetch -q origin main
          for p in "${paths[@]}"; do
            if [ "$(git rev-parse "origin/main:$p")" != "$(git rev-parse "HEAD:$p")" ]; then
              echo "::notice::main has a newer $p; the run for that push uploads the live voice"
              exit 0
            fi
          done
          changed=false
          if [ -n "${BEFORE:-}" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --quiet "$BEFORE" HEAD -- "${paths[@]}" || changed=true
          fi
          stale=false
          mkdir -p current
          for os in windows macos; do
            have=""
            if gh release download live-voice -R "$GITHUB_REPOSITORY" -p "live-voice-$os.zip" -D current --clobber; then
              have="$(unzip -p "current/live-voice-$os.zip" voice-source.txt || true)"
            fi
            echo "live-voice-$os.zip on the release: built from '${have:-nothing}', this commit has $want"
            [ "$have" = "$want" ] || stale=true
          done
          if [ "$changed" = false ] && [ "$stale" = false ]; then
            echo "The live-voice release is up to date"
            exit 0
          fi
          live=Godot/voices/live
          for os in windows macos; do
            case "$os" in
              windows) lib=chimera_voice.windows.x86_64.dll ;;
              macos) lib=libchimera_voice.macos.dylib ;;
            esac
            found=(artifacts/*/bin/"$lib")
            [ -f "${found[0]}" ] || { echo "::error::no $lib in the voice artifacts:"; find artifacts -type f; exit 1; }
            mkdir -p "$live/bin"
            rm -f "$live"/bin/*
            cp "${found[0]}" "$live/bin/"
            bash tools/build-voice.sh list
            echo "$want" > "$live/voice-source.txt"
            (cd "$live" && zip -X "$RUNNER_TEMP/live-voice-$os.zip" "bin/$lib" chimera_voice.gdextension voice-source.txt)
          done
          gh release upload live-voice -R "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP/live-voice-windows.zip" "$RUNNER_TEMP/live-voice-macos.zip"
          gh release edit live-voice -R "$GITHUB_REPOSITORY" --title "Live voice" --notes "The live voice library (ChimeraVoice) for Windows and macOS, built by CI from native/chimera_voice $want. Play HumanError.bat and Play HumanError.app download it into Godot/voices/live/ when it is missing, or when native/chimera_voice has changed since it was built (voice-source.txt holds that tree's hash). By hand: unzip it into Godot/voices/live/."
          for os in windows macos; do
            rm -f "current/live-voice-$os.zip"
            gh release download live-voice -R "$GITHUB_REPOSITORY" -p "live-voice-$os.zip" -D current
            [ "$(unzip -p "current/live-voice-$os.zip" voice-source.txt)" = "$want" ] \
              || { echo "::error::live-voice-$os.zip on the release does not hold voice-source.txt $want after the upload"; exit 1; }
          done
          echo "Uploaded live-voice-windows.zip and live-voice-macos.zip, built from native/chimera_voice $want"

  build:
    needs: [voice, version]
    # A push cancels an older push's export, not its voice jobs, so their Rust cache still fills.
    # A release is never cancelled.
    concurrency:
      group: godot-export-${{ github.event_name }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    timeout-minutes: 5
    name: Godot Export
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    container:
      image: docker://barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: 'true'
        
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          # The container runs as another user than the checkout's owner, so git refuses the repo without this.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash ../tools/write-build-info.sh --stamp-project

      - name: Live voice
        uses: actions/download-artifact@v4
        with:
          pattern: voice-*
          path: Godot/voices/live
          merge-multiple: true

      - name: List the live voice libraries
        run: bash ../tools/build-voice.sh list && cat voices/live/chimera_voice.gdextension

      - name: Import
        run: godot --headless --import 2>&1 | tee -a $LOGFILE

      - name: Web Build
        run: |
            mkdir -v -p build/web
            godot --headless -v --export-release "Web" build/web/index.html 2>&1 | tee -a $LOGFILE

      - name: Mac Build
        run: |
          mkdir -v -p build/mac
          godot --headless --verbose --export-release "MacOS" build/mac/$EXPORT_NAME.zip 2>&1 | tee -a $LOGFILE
          mv build/mac/$EXPORT_NAME.zip "build/mac/$EXPORT_NAME-$VERSION.zip"

      - name: Windows Build
        run: |
          mkdir -v -p build/windows
          godot --headless --verbose --export-release "Windows Desktop" build/windows/$EXPORT_NAME.zip 2>&1 | tee -a $LOGFILE
          # Godot names the executable inside after the zip, so the version goes on afterwards.
          mv build/windows/$EXPORT_NAME.zip "build/windows/$EXPORT_NAME-$VERSION.zip"

      - name: Linux Build
        run: |
          mkdir -v -p build/linux
          godot --headless --verbose --export-release "Linux" build/linux/$EXPORT_NAME.zip 2>&1 | tee -a $LOGFILE
          mv build/linux/$EXPORT_NAME.zip "build/linux/$EXPORT_NAME-$VERSION.zip"

      - name: Upload Artifact web
        uses: actions/upload-artifact@v4
        with:
          name: Web
          path: ./Godot/build/web/

      - name: Upload Artifact Windows
        uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: ./Godot/build/windows/

      - name: Upload Artifact MacOS
        uses: actions/upload-artifact@v4
        with:
          name: MacOS
          path: ./Godot/build/mac/

      - name: Upload Artifact Linux
        uses: actions/upload-artifact@v4
        with:
          name: Linux
          path: ./Godot/build/linux/
  
      - name: Notify Discord of failure
        if: failure()
        shell: bash
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          commit_url="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          msg="There was a problem with the build for $commit_url."
          embeds="[{\"title\": \"Build Failed\", \"description\": \"See details here: ${run_url}\", \"url\": \"${run_url}\", \"color\": 10038562}]"
          data="{\"content\": \"$msg\", \"username\": \"Buildbot\", \"embeds\": $embeds}"
          wget -q -O /dev/null --header="Content-Type: application/json" --post-data="$data" "${{ secrets.DISCORD_WEBHOOK_URL }}"
      
      - name: Grep log for errors and send to discord
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          ERRORS=$(grep "ERROR" build.log | grep -v "Unable to load fontconfig" | sort -u | sed 's/\\/\\\\/g; s/"/\\"/g') || true
          if [ -n "$ERRORS" ]; then
            count=$(printf '%s\n' "$ERRORS" | wc -l | tr -d ' ')
            run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            commit_url="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
            msg="The build succeeded, but Godot printed $count errors during export.\n\n$ERRORS"
            embeds="[{\"title\": \"Build error report\", \"description\": \"See details here: ${run_url}\", \"url\": \"${run_url}\", \"color\": 10038562}]"
            data="{\"content\": \"$msg\", \"username\": \"Buildbot\", \"embeds\": $embeds}"
            wget -q -O /dev/null --header="Content-Type: application/json" --post-data="$data" "${{ secrets.DISCORD_WEBHOOK_URL }}"
          fi

  sign-mac:
    # Gatekeeper refuses an ad-hoc signed app downloaded from itch.io, so deploys get a notarized one.
    name: Sign and Notarize macOS
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TEAM_ID: M4Q2TE45WT
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Download MacOS artifact
        uses: actions/download-artifact@v4
        with:
          name: MacOS
          path: ./build/mac

      - name: Set up a throwaway signing keychain
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${CERT_P12_BASE64:-}" ] || { echo "::error::secret MACOS_CERT_P12_BASE64 is not set (a Developer ID Application certificate as base64 .p12)"; exit 1; }
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pw="$(openssl rand -base64 24)"
          cert="$RUNNER_TEMP/cert.p12"
          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$cert"
          security list-keychains -d user | sed 's/[" ]//g' > "$RUNNER_TEMP/orig-keychains.txt"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          security import "$cert" -k "$kc" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          # Lets codesign use the key without a GUI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc" >/dev/null
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$kc" $(cat "$RUNNER_TEMP/orig-keychains.txt")
          rm -f "$cert"
          identity="$(security find-identity -v -p codesigning "$kc" | sed -n "s/.*\"\(Developer ID Application: .*($TEAM_ID)\)\"/\1/p" | head -1)"
          [ -n "$identity" ] || { echo "::error::MACOS_CERT_P12_BASE64 holds no Developer ID Application identity for team $TEAM_ID"; exit 1; }
          echo "SIGNING_KEYCHAIN=$kc" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Sign
        run: |
          set -euo pipefail
          shopt -s nullglob
          zip="build/mac/$EXPORT_NAME-$VERSION.zip"
          ditto -x -k "$zip" build/unzipped
          apps=(build/unzipped/*.app)
          [ "${#apps[@]}" -eq 1 ] || { echo "::error::$zip holds ${#apps[@]} .app bundles, not 1"; find build/unzipped -maxdepth 2; exit 1; }
          app="${apps[0]}"
          # Godot's ad-hoc signature carries the entitlements the engine needs; keep them.
          codesign -d --entitlements - --xml "$app" > "$RUNNER_TEMP/entitlements.plist"
          plutil -lint "$RUNNER_TEMP/entitlements.plist"
          # Inside out: codesign --force on the bundle doesn't re-sign nested code.
          for nested in "$app"/Contents/Frameworks/*; do
            codesign --force --timestamp --options runtime --keychain "$SIGNING_KEYCHAIN" --sign "$SIGNING_IDENTITY" "$nested"
          done
          codesign --force --timestamp --options runtime --entitlements "$RUNNER_TEMP/entitlements.plist" \
            --keychain "$SIGNING_KEYCHAIN" --sign "$SIGNING_IDENTITY" "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | grep -E "^Authority=Developer ID Application|^TeamIdentifier=$TEAM_ID|^Timestamp"
          echo "APP=$app" >> "$GITHUB_ENV"

      - name: Notarize and staple
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for v in NOTARY_KEY_P8_BASE64 NOTARY_KEY_ID NOTARY_ISSUER; do
            [ -n "${!v:-}" ] || { echo "::error::secret for $v is not set (an App Store Connect API key for notarytool)"; exit 1; }
          done
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$key"
          submission="$RUNNER_TEMP/notarize.zip"
          ditto -c -k --keepParent "$APP" "$submission"
          # notarytool exits 0 even when the verdict is Invalid, so gate on the status.
          result="$(xcrun notarytool submit "$submission" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait --timeout 25m --output-format json)"
          echo "$result"
          id="$(printf '%s' "$result" | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          status="$(printf '%s' "$result" | /usr/bin/python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          if [ "$status" != "Accepted" ]; then
            xcrun notarytool log "$id" --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" || true
            echo "::error::notarization $status for submission $id"
            exit 1
          fi
          rm -f "$key" "$submission"
          xcrun stapler staple "$APP"
          spctl -a -vvv -t exec "$APP" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -q "source=Notarized Developer ID" "$RUNNER_TEMP/spctl.txt"
          mkdir -p build/signed
          ditto -c -k --keepParent "$APP" "build/signed/$EXPORT_NAME-$VERSION.zip"

      - name: Remove the signing keychain
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            # shellcheck disable=SC2046
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/orig-keychains.txt")
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi

      - name: Upload Artifact MacOS signed
        uses: actions/upload-artifact@v4
        with:
          name: MacOS-signed
          path: ./build/signed/
          if-no-files-found: error

      - name: Notify Discord of signing failure
        if: failure()
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          commit_url="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          msg="macOS signing or notarization failed for $commit_url, so nothing was deployed."
          embeds="[{\"title\": \"Signing Failed\", \"description\": \"See details here: ${run_url}\", \"url\": \"${run_url}\", \"color\": 10038562}]"
          data="{\"content\": \"$msg\", \"username\": \"Buildbot\", \"embeds\": $embeds}"
          curl -fsS -o /dev/null -H "Content-Type: application/json" -d "$data" "${{ secrets.DISCORD_WEBHOOK_URL }}"

  deploy:
    name: Itch.io Deploy
    needs: [version, build, sign-mac]
    runs-on: ubuntu-latest
    if: needs.version.outputs.release == 'true'
    env:
      VERSION: ${{ needs.version.outputs.version }}
    container:
      image: docker://barichello/godot-ci:4.7.2
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: Web
          path: ./build/web

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: Windows
          path: ./build/windows

      - name: Download signed MacOS artifact
        uses: actions/download-artifact@v4
        with:
          name: MacOS-signed
          path: ./build/mac

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: Linux
          path: ./build/linux

      - name: Itch.io
        run: |
          set -euo pipefail
          for v in ITCHIO_API_KEY ITCHIO_USERNAME ITCHIO_GAME; do
            [ -n "${!v:-}" ] || { echo "::error::secret $v is not set"; exit 1; }
          done
          export BUTLER_API_KEY="$ITCHIO_API_KEY"
          target="$ITCHIO_USERNAME/$ITCHIO_GAME"
          # itch.io names each download after its channel and shows --userversion under it.
          butler push ./build/web "$target:web" --userversion "$VERSION"
          for channel in mac windows linux; do
            butler push "./build/$channel/$EXPORT_NAME-$VERSION.zip" "$target:$channel" --userversion "$VERSION"
          done

      - name: Notify Discord of deploy failure
        if: failure()
        shell: bash
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          commit_url="${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}"
          msg="Itch.io deploy failed for $commit_url."
          embeds="[{\"title\": \"Deploy Failed\", \"description\": \"See details here: ${run_url}\", \"url\": \"${run_url}\", \"color\": 10038562}]"
          data="{\"content\": \"$msg\", \"username\": \"Buildbot\", \"embeds\": $embeds}"
          wget -q -O /dev/null --header="Content-Type: application/json" --post-data="$data" "${{ secrets.DISCORD_WEBHOOK_URL }}"

  github-release:
    name: GitHub Release
    needs: [version, deploy]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Release notes from the tag-to-tag compare
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PREVIOUS: ${{ needs.version.outputs.previous }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::notice::$tag already has a GitHub release"
            exit 0
          fi
          if [ -n "$PREVIOUS" ]; then
            gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$PREVIOUS...$tag" \
              --jq '.commits[] | select(.parents | length == 1) | "- " + (.commit.message | split("\n")[0])' > notes.md
          else
            echo "The first release." > notes.md
          fi
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --verify-tag --title "$EXPORT_NAME $VERSION" --notes-file notes.md
