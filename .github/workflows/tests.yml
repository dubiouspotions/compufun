name: "tests"
on:
  push:
    branches:
      - "main"
  pull_request: {}
  workflow_dispatch: {}

# One group per commit, so that a newer push never cancels a commit's test verdict.
concurrency:
  group: tests-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: Godot

jobs:
  tests:
    name: Tests
    timeout-minutes: 10
    runs-on: ubuntu-latest
    container:
      image: docker://barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: 'true'

      - name: Setup
        run: |
          # The container runs as another user than the checkout's owner, so git refuses the repo without this.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash ../tools/write-build-commit.sh

      - name: Import
        run: godot --headless --import

      - name: Tests
        # Passes only on the "N of N tests passed" line, so a run that dies early fails even if Godot exits 0.
        run: |
          timeout 300 godot --headless -s res://tests/run.gd 2>&1 | tee tests.log
          awk '$0 ~ /^[0-9]+ of [0-9]+ tests passed$/ && $1 == $3 && $1 > 0 {ok = 1} END {exit !ok}' tests.log \
            || { echo "::error::tests/run.gd printed no 'N of N tests passed' line; see the output above"; exit 1; }
